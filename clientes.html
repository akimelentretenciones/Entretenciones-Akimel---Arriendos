<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AKIMEL — Mensajes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0071ce">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AKIMEL">
<style>
:root{
  --bg:#f0f4f8;--bg2:#ffffff;--bg3:#e8f0f7;--bg4:#ddeaf6;
  --blue:#0071ce;--blue2:#005fa3;--blue3:#041e42;
  --green:#5fb446;--yellow:#ffc220;--orange:#fa6400;--red:#de1c24;
  --text:#041e42;--text2:#3a5068;--text3:#7a93aa;
  --border:rgba(0,113,206,0.12);--card:rgba(0,113,206,0.04);
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,0.07)
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%}
input,select,textarea,button{font-size:16px;}
@media(max-width:768px){input,select,textarea{font-size:16px!important}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

header{background:var(--blue3);padding:0 12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;background:var(--yellow);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:rgba(255,255,255,.6);font-weight:400}

.main{padding:24px;max-width:1400px;margin:0 auto;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.section{display:none}
.section.active{display:block}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--blue)}
.kpi.green{border-left-color:var(--green)}.kpi.yellow{border-left-color:var(--yellow)}.kpi.orange{border-left-color:var(--orange)}
.kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:8px}
.kpi-value{font-size:22px;font-weight:800;color:var(--text)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}

.filter-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;box-shadow:var(--shadow)}
.filter-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.filter-btn:hover{border-color:var(--blue)}

.table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);background:#fff;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:var(--bg3)}
th{padding:11px 14px;text-align:left;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;white-space:nowrap;border-bottom:2px solid var(--border)}
td{padding:11px 14px;border-top:1px solid var(--border);color:var(--text2)}
td:first-child{color:var(--text);font-weight:600}
tr:hover td{background:var(--bg3)}

.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.badge-pend{background:rgba(0,113,206,.1);color:var(--blue)}
.badge-install{background:rgba(95,180,70,.1);color:var(--green)}
.badge-retir{background:rgba(222,28,36,.1);color:var(--red)}

.detail-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.detail-header{font-size:18px;font-weight:800;color:var(--text);margin-bottom:16px}
.detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.detail-value{color:var(--text);font-weight:600;text-align:right}

.messages-section{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.messages-title{font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.messages-list{margin-bottom:16px}
.message-item{background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.message-time{font-size:10px;color:var(--text3);margin-bottom:4px}
.message-text{font-size:12px;color:var(--text);line-height:1.5}
.messages-empty{text-align:center;padding:20px;color:var(--text3);font-size:12px}

.message-input-group{display:flex;gap:8px;margin-top:16px}
.message-input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'Sora',sans-serif;font-size:13px;color:var(--text);outline:none}
.message-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,206,.1)}
.message-btn{padding:7px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:'Sora',sans-serif}
.message-btn:hover{background:var(--blue2)}

.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;margin-bottom:16px;font-family:'Sora',sans-serif}
.back-btn:hover{background:var(--bg4)}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">💬</div>
    <div>
      <div class="logo-text">AKIMEL</div>
      <div class="logo-sub">Mensajes</div>
    </div>
  </div>
</header>

<div class="main">

  <!-- ── LISTA DE ARRIENDOS ─────────────────────── -->
  <div class="section active" id="pg-list">
    <h2 style="font-size:22px;font-weight:800;color:var(--blue3);margin-bottom:20px">Mis Arriendos</h2>
    
    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-label">Próximos</div>
        <div class="kpi-value" id="s-prox">0</div>
      </div>
      <div class="kpi green">
        <div class="kpi-label">Pendiente de pago</div>
        <div class="kpi-value" id="s-pend">$0</div>
      </div>
      <div class="kpi yellow">
        <div class="kpi-label">Pagados</div>
        <div class="kpi-value" id="s-pagados">0</div>
      </div>
      <div class="kpi orange">
        <div class="kpi-label">Total esta semana</div>
        <div class="kpi-value" id="s-total">$0</div>
      </div>
    </div>

    <div style="margin-bottom:20px">
      <h3 style="font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px">Filtrar por estado</h3>
      <div class="filter-bar">
        <button class="filter-btn on" onclick="setFiltro('todos')">Todos</button>
        <button class="filter-btn" onclick="setFiltro('Pendiente')">Pendientes</button>
        <button class="filter-btn" onclick="setFiltro('Pagado')">Pagados</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Fecha</th>
            <th>Comuna</th>
            <th>Monto</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="list-container">
          <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text3)">Cargando arriendos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ── DETALLE Y MENSAJES ──────────────────────── -->
  <div class="section" id="pg-detalle">
    <button class="back-btn" onclick="volverLista()">← Volver a Arriendos</button>
    <div id="detalle-container"></div>
  </div>

</div>

<script>
// Variables globales
let arriendos = [];
let mensajes = JSON.parse(localStorage.getItem('akimel_mensajes') || '{}');
let filtroActual = 'todos';
let arriendoActual = null;
let db = null;

const fmt$ = n => n ? '$' + parseInt(n).toLocaleString('es-CL') : '$0';
const today = () => new Date().toISOString().split('T')[0];
const dowFull = s => s ? ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][new Date(s+'T12:00').getDay()] : '';
const fmtFecha = s => {
  if(!s) return '';
  const d = new Date(s+'T12:00');
  return d.toLocaleDateString('es-CL',{day:'numeric',month:'short'});
};

const save = () => localStorage.setItem('akimel_mensajes', JSON.stringify(mensajes));

function toast(msg) {
  const existente = document.querySelector('.toast');
  if(existente) existente.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid rgba(0,113,206,.2);padding:12px 20px;border-radius:8px;font-size:13px;color:var(--text);z-index:300;box-shadow:var(--shadow)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2000);
}

function renderList() {
  const filtered = arriendos.filter(a => {
    if(filtroActual === 'todos') return true;
    return a.estado === filtroActual;
  }).sort((a,b) => a.fecha.localeCompare(b.fecha));

  const proximos = filtered.filter(a => a.fecha >= today()).length;
  const pendientes = filtered.filter(a => a.estado === 'Pendiente');
  const totPend = pendientes.reduce((s,a) => s + (parseInt(a.monto)||0), 0);
  const pagados = filtered.filter(a => a.estado === 'Pagado').length;
  const totAll = filtered.reduce((s,a) => s + (parseInt(a.monto)||0), 0);

  document.getElementById('s-prox').textContent = proximos;
  document.getElementById('s-pend').textContent = fmt$(totPend);
  document.getElementById('s-pagados').textContent = pagados;
  document.getElementById('s-total').textContent = fmt$(totAll);

  const tbody = document.getElementById('list-container');
  if(filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text3)">Sin arriendos</td></tr>';
  } else {
    tbody.innerHTML = filtered.map(a => {
      const badgeClass = a.estado === 'Pagado' ? 'badge-install' : a.estado === 'Cancelado' ? 'badge-retir' : 'badge-pend';
      const badgeText = a.estado || 'Pendiente';
      return `
        <tr onclick="verDetalle('${a.id}')" style="cursor:pointer">
          <td>${a.cliente}</td>
          <td>${fmtFecha(a.fecha)}</td>
          <td>${a.comuna || '—'}</td>
          <td>${fmt$(a.monto)}</td>
          <td><span class="badge ${badgeClass}">${badgeText}</span></td>
          <td style="text-align:right;color:var(--blue);font-weight:600">→</td>
        </tr>
      `;
    }).join('');
  }
}

function verDetalle(id) {
  arriendoActual = arriendos.find(x => x.id === id);
  if(!arriendoActual) return;

  const msgsKey = `arriendo_${arriendoActual.id}`;
  const msgs = mensajes[msgsKey] || [];

  const container = document.getElementById('detalle-container');
  
  let html = `
    <div class="detail-card">
      <div class="detail-header">${arriendoActual.cliente}</div>
      <div class="detail-row">
        <span class="detail-label">Estado</span>
        <span class="detail-value"><span class="badge ${arriendoActual.estado === 'Pagado' ? 'badge-install' : arriendoActual.estado === 'Cancelado' ? 'badge-retir' : 'badge-pend'}">${arriendoActual.estado || 'Pendiente'}</span></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Fecha</span>
        <span class="detail-value">${fmtFecha(arriendoActual.fecha)} · ${dowFull(arriendoActual.fecha)}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Hora</span>
        <span class="detail-value">${arriendoActual.hora || '—'}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Dirección</span>
        <span class="detail-value">${arriendoActual.direccion || '—'}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Comuna</span>
        <span class="detail-value">${arriendoActual.comuna || '—'}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Teléfono</span>
        <span class="detail-value">${arriendoActual.telefono ? `<a href="tel:${arriendoActual.telefono}" style="color:var(--blue);text-decoration:none">${arriendoActual.telefono}</a>` : '—'}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Juegos</span>
        <span class="detail-value" style="text-align:right;max-width:50%">${(arriendoActual.juegos||[]).join(', ') || '—'}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Monto</span>
        <span class="detail-value" style="font-size:15px;font-weight:800;color:var(--blue)">${fmt$(arriendoActual.monto)}</span>
      </div>
    </div>

    <div class="messages-section">
      <div class="messages-title">Mensajes (${msgs.length})</div>
      <div class="messages-list">
        ${msgs.length
          ? msgs.map((m) => `
            <div class="message-item">
              <div class="message-time">${new Date(m.time).toLocaleString('es-CL',{hour:'2-digit',minute:'2-digit'})}</div>
              <div class="message-text">${m.text}</div>
            </div>
          `).join('')
          : '<div class="messages-empty">Sin mensajes aún</div>'
        }
      </div>
      <div class="message-input-group">
        <input type="text" class="message-input" id="msg-input" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter')agregarMensaje()">
        <button class="message-btn" onclick="agregarMensaje()">Enviar</button>
      </div>
    </div>
  `;

  container.innerHTML = html;
  ir('detalle');
  setTimeout(() => {
    const input = document.getElementById('msg-input');
    if(input) input.focus();
  }, 100);
}

function agregarMensaje() {
  if(!arriendoActual) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text) return;

  const msgsKey = `arriendo_${arriendoActual.id}`;
  if(!mensajes[msgsKey]) mensajes[msgsKey] = [];
  mensajes[msgsKey].push({
    text,
    time: new Date().toISOString()
  });

  save();
  toast('✓ Mensaje guardado');
  input.value = '';
  verDetalle(arriendoActual.id);
}

function setFiltro(f) {
  filtroActual = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  event.target.classList.add('on');
  renderList();
}

function ir(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('pg-' + name).classList.add('active');
  if(name === 'list') renderList();
}

function volverLista() {
  ir('list');
}

// Inicializar Firebase
async function initFirebase() {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js");
    const { getFirestore, collection, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js");

    const firebaseConfig = {
      apiKey: "AIzaSyB-1PQ0xHHoXBqb0H5LI0GWEfL6tUYGMTA",
      authDomain: "base-de-datos-akimel-arriendos.firebaseapp.com",
      projectId: "base-de-datos-akimel-arriendos",
      storageBucket: "base-de-datos-akimel-arriendos.firebasestorage.app",
      messagingSenderId: "319707843854",
      appId: "1:319707843854:web:fe82dd81dade45eb4bcc1e"
    };

    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);

    // Escuchar cambios en Firestore
    onSnapshot(collection(db, 'arriendos'), (snap) => {
      arriendos = [];
      snap.forEach(doc => {
        arriendos.push({
          id: doc.id,
          ...doc.data()
        });
      });
      renderList();
      
      if(arriendoActual && document.getElementById('pg-detalle').classList.contains('active')) {
        const actualizado = arriendos.find(a => a.id === arriendoActual.id);
        if(actualizado) {
          arriendoActual = actualizado;
          verDetalle(arriendoActual.id);
        }
      }
    }, (error) => {
      console.error('Error en Firestore:', error);
      document.getElementById('list-container').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--red)">Error al cargar datos</td></tr>';
    });

  } catch(err) {
    console.error('Error inicializando Firebase:', err);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initFirebase();
  ir('list');
});
</script>
</body>
</html>
