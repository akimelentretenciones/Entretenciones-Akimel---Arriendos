<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AKIMEL — Enviar Mensajes</title>
<meta name="theme-color" content="#0071ce">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  --bg: #f0f4f8;
  --bg2: #ffffff;
  --bg3: #e8f0f7;
  --blue: #0071ce;
  --blue2: #005fa3;
  --blue3: #041e42;
  --green: #5fb446;
  --text: #041e42;
  --text2: #3a5068;
  --text3: #7a93aa;
  --border: rgba(0,113,206,.12);
  --wa: #25D366;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,.07);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: var(--blue3);
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
  color: white;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 34px;
  height: 34px;
  background: var(--green);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
}

.logo-text {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -.3px;
}

.main {
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
  padding-bottom: 40px;
}

.import-section {
  background: white;
  padding: 24px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  text-align: center;
}

.import-section h2 {
  margin-bottom: 12px;
  color: var(--blue3);
}

.import-section p {
  color: var(--text3);
  font-size: 14px;
  margin-bottom: 16px;
}

.btn {
  background: var(--blue);
  color: white;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  transition: all .2s;
}

.btn:hover {
  background: var(--blue2);
}

.btn-secondary {
  background: var(--bg3);
  color: var(--text2);
  margin-left: 8px;
}

.btn-secondary:hover {
  background: var(--border);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.stat {
  background: white;
  padding: 16px;
  border-radius: var(--radius);
  border-left: 4px solid var(--blue);
  box-shadow: var(--shadow);
}

.stat-v {
  font-size: 28px;
  font-weight: 800;
  color: var(--blue);
}

.stat-l {
  font-size: 12px;
  color: var(--text3);
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.filters {
  background: white;
  padding: 16px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.filters select,
.filters input {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Sora', sans-serif;
}

.table-container {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead {
  background: var(--bg3);
}

th {
  padding: 12px;
  text-align: left;
  font-weight: 700;
  color: var(--text2);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .6px;
  border-bottom: 2px solid var(--border);
}

td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text2);
}

tr:hover td {
  background: var(--bg3);
}

.cliente-cell {
  font-weight: 700;
  color: var(--text);
}

.monto-cell {
  font-weight: 700;
  color: var(--blue);
}

.btn-wa {
  background: rgba(37, 211, 102, .15);
  color: var(--wa);
  border: 1.5px solid rgba(37, 211, 102, .5);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  transition: all .2s;
  font-family: 'Sora', sans-serif;
}

.btn-wa:hover {
  background: rgba(37, 211, 102, .25);
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.empty-txt {
  font-size: 16px;
}

#file-input {
  display: none;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--blue3);
  color: white;
  padding: 12px 20px;
  border-radius: 30px;
  box-shadow: var(--shadow);
  z-index: 1000;
}

.toast.ok {
  background: var(--green);
}

@media (max-width: 768px) {
  table { font-size: 11px; }
  th, td { padding: 8px; }
  .filters { flex-direction: column; align-items: stretch; }
  .filters select, .filters input { width: 100%; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">💬</div>
    <div>
      <div class="logo-text">AKIMEL Mensajes</div>
      <div style="font-size: 10px; color: rgba(255,255,255,.6);">Enviar confirmaciones</div>
    </div>
  </div>
</header>

<div class="main">
  <div class="import-section">
    <h2>📥 Importar arriendos</h2>
    <p>En index.html haz clic en "Exportar como JSON" y carga el archivo aquí</p>
    <button class="btn" onclick="document.getElementById('file-input').click()">📄 Cargar JSON</button>
    <input type="file" id="file-input" accept=".json" onchange="cargarJSON(event)">
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-v" id="stat-total">0</div>
      <div class="stat-l">Total</div>
    </div>
    <div class="stat">
      <div class="stat-v" id="stat-semana">0</div>
      <div class="stat-l">Esta semana</div>
    </div>
    <div class="stat">
      <div class="stat-v" id="stat-monto">$0</div>
      <div class="stat-l">Monto</div>
    </div>
  </div>

  <div class="filters">
    <select id="filtro-mes">
      <option value="">Todos</option>
      <option value="1">Enero</option>
      <option value="2">Febrero</option>
      <option value="3">Marzo</option>
      <option value="4">Abril</option>
      <option value="5">Mayo</option>
      <option value="6">Junio</option>
      <option value="7">Julio</option>
      <option value="8">Agosto</option>
      <option value="9">Septiembre</option>
      <option value="10">Octubre</option>
      <option value="11">Noviembre</option>
      <option value="12">Diciembre</option>
    </select>
    <input type="search" id="filtro-cliente" placeholder="Buscar cliente..." style="flex: 1;">
    <button onclick="renderTable()" style="padding: 8px 16px; background: var(--blue); color: white; border: none; border-radius: 8px; cursor: pointer;">Filtrar</button>
  </div>

  <div class="table-container">
    <table id="tabla">
      <thead>
        <tr>
          <th>#</th>
          <th>Cliente</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Teléfono</th>
          <th>Juegos</th>
          <th>Monto</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty">
      <div class="empty-icon">📭</div>
      <div class="empty-txt">Importa un archivo JSON para ver arriendos</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let arriendos = [];

function cargarJSON(event) {
  const file = event.target.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      arriendos = JSON.parse(e.target.result);
      showToast(`✓ ${arriendos.length} arriendos importados`);
      renderStats();
      renderTable();
    } catch(err) {
      showToast('✗ Error en JSON');
    }
  };
  reader.readAsText(file);
}

function renderStats() {
  const filtrados = filtrarArriendos();
  document.getElementById('stat-total').textContent = arriendos.length;
  
  const hoy = new Date();
  const primero = hoy.getDate() - hoy.getDay() + (hoy.getDay() === 0 ? -6 : 1);
  const lunes = new Date(hoy.setDate(primero));
  const domingo = new Date(lunes);
  domingo.setDate(domingo.getDate() + 6);
  
  const semana = arriendos.filter(a => {
    const [d, m, y] = a.fecha.split('/');
    const fecha = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
    return fecha >= lunes && fecha <= domingo;
  });
  
  document.getElementById('stat-semana').textContent = semana.length;
  const monto = filtrados.reduce((s, a) => s + (parseInt(a.monto) || 0), 0);
  document.getElementById('stat-monto').textContent = '$' + monto.toLocaleString('es-CL');
}

function filtrarArriendos() {
  let filtrados = arriendos;
  const mes = document.getElementById('filtro-mes').value;
  const cliente = document.getElementById('filtro-cliente').value.toLowerCase();
  
  if(mes) {
    filtrados = filtrados.filter(a => {
      const [d, m, y] = a.fecha.split('/');
      return parseInt(m) === parseInt(mes);
    });
  }
  
  if(cliente) {
    filtrados = filtrados.filter(a => a.cliente.toLowerCase().includes(cliente));
  }
  
  return filtrados;
}

function renderTable() {
  const filtrados = filtrarArriendos();
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  
  if(filtrados.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  
  empty.style.display = 'none';
  tbody.innerHTML = filtrados.map((a, i) => {
    const fecha = a.fecha ? a.fecha.split('/').reverse().join('/') : '—';
    const monto = a.monto ? '$' + parseInt(a.monto).toLocaleString('es-CL') : '$0';
    const juegos = (a.juegos || []).join(', ') || '—';
    
    return `<tr>
      <td>${i+1}</td>
      <td class="cliente-cell">${a.cliente || '—'}</td>
      <td>${fecha}</td>
      <td>${a.hora || '—'}</td>
      <td>${a.telefono || '—'}</td>
      <td style="font-size:12px">${juegos}</td>
      <td class="monto-cell">${monto}</td>
      <td><button class="btn-wa" onclick="enviarMensaje('${a.cliente}','${a.fecha}','${a.telefono}','${a.hora}','${(a.juegos||[]).join(', ')}','${monto}')">💬</button></td>
    </tr>`;
  }).join('');
}

function getDayName(fecha) {
  if(!fecha) return 'ese día';
  const [d, m, y] = fecha.split('/');
  const date = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
  const dias = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  return dias[date.getDay()];
}

function enviarMensaje(cliente, fecha, telefono, hora, juegos, monto) {
  if(!telefono) { showToast('⚠️ Sin teléfono'); return; }
  
  const dayName = getDayName(fecha);
  let msg = `¡Hola ${cliente}! 👋\n\nTe recordamos que este ${dayName} tienes tu arriendo con Akimel ⚡\n\n📆 ${fecha}${hora ? ' a las ' + hora : ''}\n🎪 ${juegos || 'juegos'}\n💰 Monto: ${monto}\n\n✓ ¿Confirmamos? 🎉`;
  
  let phone = telefono.replace(/\D/g, '');
  if(!phone.startsWith('56')) phone = '56' + (phone.startsWith('9') ? phone : phone);
  
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  showToast('✓ WhatsApp abierto');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast';
  if(msg.includes('✓')) toast.classList.add('ok');
  setTimeout(() => { toast.style.display = 'none'; }, 3000);
  toast.style.display = 'block';
}

renderStats();
</script>

</body>
</html>
